name: world_time
description: A world time application.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  cupertino_icons: ^1.0.9
  flutter:
    sdk: flutter
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  url_strategy: ^0.3.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  rename: ^3.1.0

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: true
  web:
    generate: true

flutter:
  uses-material-design: true

  assets:
    - assets/time/
    - assets/flag/
